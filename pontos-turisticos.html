<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title.attractions">Pontos turísticos · Rio Viva</title>
  <meta name="description" content="Pontos turísticos recomendados no Rio de Janeiro." data-i18n-content="meta.desc.attractions">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="attractions">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Pular para o conteúdo</a>
  <header id="site-header"></header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <div class="crumb"><a href="index.html" data-i18n="nav.home">Início</a> / <span data-i18n="nav.attractions">Pontos turísticos</span></div>
        <h1 data-i18n="attr.title">Pontos turísticos recomendados</h1>
        <p data-i18n="attr.intro">Dos cartões-postais às descobertas fora do óbvio: filtre por interesse e veja dicas práticas de cada lugar.</p>
      </div>
    </section>

    <section class="section" style="padding-top:1.5rem">
      <div class="container">
        <div class="toolbar">
          <div class="chips" id="chips" role="group" data-i18n-aria="attr.filters"></div>
          <label class="visually-hidden" for="search" data-i18n="common.search">Buscar</label>
          <input class="field search" id="search" type="search" autocomplete="off" data-i18n-ph="common.search">
          <span class="result-count" id="count" aria-live="polite"></span>
        </div>
        <div class="grid" id="grid"></div>
        <p class="note" style="margin-top:1.5rem" data-i18n="common.confirm">Informações ilustrativas — confirme horários, preços e disponibilidade nos canais oficiais antes de ir.</p>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/data/attractions-data.js"></script>
  <script src="js/data/photos-data.js"></script>
  <script src="js/pages/attractions.js"></script>
</body>
</html>
